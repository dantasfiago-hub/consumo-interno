name: Verificar e compilar
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
        working-directory: tests_backend
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Empacotar Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath consumo_interno_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: consumo-interno-windows
          path: consumo_interno_windows.zip
  android:
    if: github.event_name != 'pull_request' && vars.CONSUMO_ANDROID_RELEASE == 'true'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: flutter pub get
      - name: Preparar assinatura privada
        env:
          KEY_PROPERTIES_B64: ${{ secrets.CONSUMO_KEY_PROPERTIES_B64 }}
          KEYSTORE_B64: ${{ secrets.CONSUMO_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          if not os.environ['KEY_PROPERTIES_B64'] or not os.environ['KEYSTORE_B64']:
              raise SystemExit('Configure os dois secrets de assinatura antes de compilar release.')
          Path('android/signing').mkdir(parents=True, exist_ok=True)
          Path('android/key.properties').write_bytes(base64.b64decode(os.environ['KEY_PROPERTIES_B64'], validate=True))
          Path('android/signing/release-keystore.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'], validate=True))
          PY
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: consumo-interno-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
  android-debug:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: consumo-interno-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
