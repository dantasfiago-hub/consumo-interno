name: consumo_interno
description: Controle offline de consumo interno com sincronizacao Supabase.
publish_to: none
version: 1.7.0+11
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.28.2
  sqlite3_flutter_libs: 0.5.39
  path_provider: 2.1.5
  path: 1.9.1
  uuid: 4.5.1
  crypto: ^3.0.6
  http: 1.5.0
  intl: ^0.20.2
  file_picker: 10.3.3
  image: 4.5.4
  qr_flutter: 4.1.0
  qr: 3.0.2
  mobile_scanner: 7.4.2
  zxing2: 0.2.4
  pdf: 3.11.3
  flutter_secure_storage: 9.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto_LICENSE.txt

